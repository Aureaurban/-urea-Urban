    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c5a059; --dark: #1a1a1a; --light: #ffffff; }
        body { margin: 0; font-family: 'Montserrat', sans-serif; color: var(--dark); }
        
        /* Navegación */
        nav { background: rgba(26, 26, 26, 0.9); padding: 20px 10%; display: flex; justify-content: space-between; align-items: center; position: fixed; width: 80%; top: 0; z-index: 1000; }
        nav a { color: var(--light); text-decoration: none; text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem; margin-left: 20px; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.2rem; letter-spacing: 4px; margin-left: 0 !important; }

        header { height: 100vh; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070&auto=format&fit=crop') no-repeat center center/cover; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
        h1 { font-family: 'Playfair Display', serif; font-size: 4rem; letter-spacing: 8px; margin: 0; }
        
        section { padding: 100px 10%; text-align: center; }
        .btn { display: inline-block; padding: 15px 40px; border: 2px solid var(--gold); text-decoration: none; color: var(--gold); font-weight: 600; letter-spacing: 2px; margin-top: 20px; transition: 0.3s; }
        .btn:hover { background: var(--gold); color: white; }
        footer { padding: 20px; background: var(--dark); color: white; text-align: center; font-size: 0.7rem; }
    </style>
</head>

    <section>

        <div style="margin-top: 40px;">
