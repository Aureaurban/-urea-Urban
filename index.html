<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Áurea Urban | Diseño y Estilo</title>
    <style>
        body {
            margin: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        h1 {
            font-weight: 300;
            letter-spacing: 5px;
            text-transform: uppercase;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            display: inline-block;
        }
        p {
            font-style: italic;
            color: #666;
            margin-top: 20px;
        }
        .cta {
            margin-top: 40px;
            padding: 10px 20px;
            border: 1px solid #333;
            text-decoration: none;
            color: #333;
            transition: all 0.3s;
        }
        .cta:hover {
            background-color: #333;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ÁUREA URBAN</h1>
        <p>Redefiniendo el espacio, elevando el estilo de vida.</p>
        <br><br>
        <a href="mailto:hola@aureaurban.com" class="cta">CONTACTO</a>
    </div>
</body>
</html>
